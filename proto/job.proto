syntax = "proto3";

package job.v1;

option go_package = "github.com/OscarNunezU/distributed-job-processor/query-service/gen/job/v1";

service JobService {
  rpc GetJob   (GetJobRequest)   returns (JobResponse);
  rpc ListJobs (ListJobsRequest) returns (ListJobsResponse);
}

message GetJobRequest {
  string id = 1;
}

message ListJobsRequest {
  int32 limit  = 1;
  int32 offset = 2;
}

message JobResponse {
  string id           = 1;
  string type         = 2;
  string status       = 3;
  int32  attempts     = 4;
  int32  max_attempts = 5;
  string created_at   = 6;
}

message ListJobsResponse {
  repeated JobResponse jobs  = 1;
  int32                total = 2;
}
